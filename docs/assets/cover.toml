name        = "pwn-shop"
description = "Tool packages for pwn-broker, built from upstream releases"

[panel]
kind   = "flow"
status = ["ok upstream release pinned by SHA-256"]

[panel.input]
label = "Upstream Release"
note  = "verified"
chips = ["release", "SHA-256"]
tone  = "steel-ink"

[panel.tool]
label = "pwn-shop"
note  = "Python"

[panel.output]
label = "Tool Package"
note  = "pwn-broker"
chips = ["kerbrute-1.0.3-1.zip"]
tone  = "mint"
