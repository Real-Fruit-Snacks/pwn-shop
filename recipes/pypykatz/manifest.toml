schema = 2
requires = ["python-3.13"]
kind = "kali"
description = "Offline Windows credential and security-artifact parsing in Python"
tags = ["windows", "credentials", "lsass", "registry"]
upstream = "https://github.com/skelsec/pypykatz"
licence = "MIT"
arch = "x86_64"
