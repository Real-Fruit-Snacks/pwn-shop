schema = 2
requires = ["python-3.13"]
kind = "kali"
description = "Windows network protocols, Active Directory attacks and remote administration"
tags = ["ad", "smb", "kerberos", "windows"]
upstream = "https://github.com/fortra/impacket"
licence = "Apache-2.0 with additional notices"
arch = "x86_64"
examples = [
  "impacket-GetUserSPNs '{domain}/user:password' -dc-ip {ip} -request",
  "impacket-secretsdump '{domain}/user:password@{ip}'",
  "impacket-psexec '{domain}/user:password@{hostname}'",
]

