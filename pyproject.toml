[project]
name = "pwn-shop"
version = "0.1.0"
description = "Recipes and the package builder for pwn-broker tools"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "tomli-w>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
