name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push run is never cancelled, so a later push cannot stop an earlier one half way through
  # publishing. GitHub keeps one pending run per group, though: of three quick pushes the
  # middle one is dropped. Nothing is lost, because the next run publishes every build that
  # has no release. A pull request run gives way to a newer one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    # fetch.sh runs on a machine with nothing but sh, and kali-packages.sh in a bare Kali, so
    # both are read by sh and dash as well as shellcheck; the Python files are only compiled
    # here (the tests run them, and the packages and kali jobs run build.py and
    # install-check.py).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Syntax
        run: |
          for script in fetch.sh .github/scripts/kali-packages.sh; do
            sh -n "$script"
            dash -n "$script"
          done
      - name: shellcheck
        run: shellcheck fetch.sh .github/scripts/kali-packages.sh
      - name: Compile
        run: python -m py_compile build.py .github/scripts/install-check.py tools/runtime-licence.py

  test:
    # The unit tests need no network and no pwn-broker. build.py needs 3.11 or later.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # pytest is not pinned: this job holds no token that can write. tomli-w comes from
        # the pinned file, as in the jobs that do.
        run: |
          python -m pip install pytest
          python -m pip install --require-hashes -r ci-requirements.txt
      - name: Tests
        run: python -m pytest -q -W error

  art:
    # The README panel is generated; fail if docs/assets/panel-*.svg no longer match
    # docs/art/make-panel.py. The panel's unit test runs here too: the test jobs do not install
    # fonttools, so there it skips.
    name: README panel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Redraw the panel
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-panel.py
          git diff --exit-code -- docs/assets/panel-dark.svg docs/assets/panel-light.svg
      - name: The panel's test
        # pytest is not pinned, as in the test job; tomli-w is, because the tests' conftest imports it
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet --require-hashes -r ci-requirements.txt
          python -m pytest -q -W error tests/test_panel.py

  packages:
    # Each Python builds or downloads every package and installs it with pwn-broker's own code,
    # a tool after the runtime it requires. Nothing in the build proves that a Python tool's
    # lock is its whole dependency set; the install, which uses no index, does. A Python tool
    # runs on its runtime, not on the Python of the leg, so the legs no longer test the tools
    # under three Pythons: they show that pwn-broker, which runs on the machine's own Python,
    # installs a tool and its runtime whichever of these it runs on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    outputs:
      dist: ${{ steps.sums.outputs.dist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.320'
      - name: Install
        run: python -m pip install --require-hashes -r ci-requirements.txt
      - name: Download each published package
        # A build that has a release is tested from the published bytes, so CI and a user never
        # see different files under one tag. The releases are read a page at a time, so their
        # number has no limit, and a draft does not count: it is what a publish that stopped
        # half way leaves behind, and it has no files to download. A build with no release is
        # built in the next step, which holds no token.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p dist
          : > published.txt
          : > to-build.txt
          python build.py plan > plan.txt
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' > releases.txt
          while read -r tool tag file; do
            if grep -Fxq -- "$tag" releases.txt; then
              card="${file%.zip}.toml"
              gh release download "$tag" --dir dist --pattern "$file" --pattern "$card" </dev/null
              want="$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' "dist/$card")"
              echo "$want  dist/$file" | sha256sum -c -
              echo "$tool $tag $file" >> published.txt
              echo "ok    $tag is published; testing the published zip"
            else
              echo "$tool" >> to-build.txt
              echo "ok    $tag has no release; building it"
            fi
          done < plan.txt
      - name: Build each package that has no release
        # A build with no release must build. A recipe with build_from_source runs build tools
        # that pip fetches without hashes, so this step is given no token, and build.py passes
        # none on to pip either.
        run: |
          set -eu
          mapfile -t to_build < to-build.txt
          if [ "${#to_build[@]}" -gt 0 ]; then
            python build.py build "${to_build[@]}" --out dist </dev/null
          fi
          python build.py index dist --out dist/index.toml </dev/null
      - name: Show the package hashes
        # Each leg prints its bytes, so the legs can be compared in the log.
        run: sha256sum dist/*.zip
      - name: Check
        run: python build.py check
      - name: Record the packages' SHA-256
        # Before everything below that runs code CI does not pin: the rebuild of each published
        # package, which runs a build_from_source recipe's unhashed build tools; pwn-broker's
        # install, which takes its dependencies from PyPI; and the install check, which starts
        # every packaged tool. Any of them could change dist/. (A new build of a recipe with
        # build_from_source has already run its build tools above; that cannot be avoided, since
        # their output is the package.)
        # publish and the kali job refuse a dist/ whose files do not give this one SHA-256. It is
        # kept twice: as this step's output, which the steps after it cannot set again, and as an
        # artifact of its own, uploaded with dist/. Both must agree, so replacing one is not
        # enough; code on this runner with root could still reach both. Only this leg sets the
        # output, and a leg that sets none leaves another's as it is.
        if: matrix.python == '3.13'
        id: sums
        run: |
          set -euo pipefail
          export LC_ALL=C
          mkdir -p "$RUNNER_TEMP/dist-sha256"
          sums="$(cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          echo "$sums" > "$RUNNER_TEMP/dist-sha256/dist.sha256"
          echo "dist=$sums" >> "$GITHUB_OUTPUT"
      - name: Keep the packages' SHA-256
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sha256
          path: ${{ runner.temp }}/dist-sha256/dist.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Keep the packages for publish
        # One leg's files are published, after the kali job has installed them, and they are
        # kept here, before the rebuilds, pwn-broker's install and the install check. A Python
        # tool's wheels are for its runtime's series whichever Python runs the build, and the
        # zip is built the same way on each.
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Check the index publish would write
        # publish rebuilds the index from the card of every release, after it has made the new
        # ones. The rules that span the whole history are applied only then: a command two
        # tools define, a build that depends on a package no release carries any more, a cycle
        # of dependencies. A history that breaks one would get its release and no index, and
        # every later push would stop at the same place. So the same index is written here
        # first, from the cards of the releases that exist and of the builds about to be
        # published, and thrown away.
        if: matrix.python == '3.13'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/{tag}/{file}
        run: |
          set -eu
          cards="$RUNNER_TEMP/cards"
          mkdir -p "$cards"
          while read -r tag; do
            if [ "$tag" != index ]; then
              gh release download "$tag" --dir "$cards" --pattern '*.toml' </dev/null
            fi
          done < releases.txt
          while read -r _ tag file; do
            if ! grep -Fxq -- "$tag" releases.txt; then
              cp "dist/${file%.zip}.toml" "$cards/"
            fi
          done < plan.txt
          python build.py index "$cards" --base-url "$BASE_URL" --out "$RUNNER_TEMP/index.toml" </dev/null
          echo "ok    the index of every release and each new build can be written"
      - name: Build each published package again and compare
        # Into fresh/, one tool at a time, and the card of that build must equal the published
        # card: a recipe that changed without its build number going up fails here.
        # --skip-index, because fresh/ is never an index: a tool is rebuilt there without the
        # runtime it requires. If the rebuild cannot fetch an upstream file (build.py exits 3),
        # that tool gets a warning and its published zip is still tested; any other failure,
        # and any difference, fails the job. It comes after the packages are kept and holds no
        # token, because rebuilding a recipe with build_from_source runs unhashed build tools.
        run: |
          set -eu
          mkdir -p fresh
          while read -r tool tag file; do
            card="${file%.zip}.toml"
            if python build.py build "$tool" --out fresh --skip-index </dev/null 2> "rebuild-$tool.err"; then
              status=0
            else
              status=$?
            fi
            cat "rebuild-$tool.err" >&2
            if [ "$status" -eq 0 ]; then
              python build.py compare "fresh/$card" "dist/$card" "fresh/$file" "dist/$file" </dev/null
              echo "ok    $tag rebuilt and equal to the published build"
            elif [ "$status" -eq 3 ]; then
              echo "::warning title=$tool::$tag cannot be rebuilt: an upstream file is gone or no longer matches the recipe. The published zip is still tested."
              echo "warn  $tag cannot be rebuilt; testing the published zip only"
            else
              echo "fail  $tag: the rebuild failed with exit status $status" >&2
              exit 1
            fi
          done < published.txt
      - name: Check out pwn-broker
        # pwn-broker is public, so no key is needed. vars.PWN_BROKER_REF names a branch of
        # pwn-broker while a change needs both repositories; without it, main is checked out.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Real-Fruit-Snacks/pwn-broker
          ref: ${{ vars.PWN_BROKER_REF || 'main' }}
          path: pwn-broker
          persist-credentials: false
      - name: Check each recipe's build would be the latest of its tool
        # The index calls the highest version of a tool its latest build, and that is the one
        # tool install takes. A recipe whose version sorts before a published one, as when a
        # tool versioned by date moves to upstream's first numbered release, would be released
        # and never installed. plan refuses it, given the published index and releases.txt,
        # the tags that have a release, which the first step of this job wrote: a withdrawn
        # build stays in the index until the next publish, and does not count.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          if grep -Fxq index releases.txt; then
            gh release download index --dir "$RUNNER_TEMP/published" --pattern index.toml </dev/null
            python build.py plan --index "$RUNNER_TEMP/published/index.toml" --releases releases.txt > /dev/null
            echo "ok    each recipe's build is, or would be, the latest of its tool"
          else
            echo "ok    no index is published yet"
          fi
      - name: Install pwn-broker
        run: |
          python -m venv "$RUNNER_TEMP/broker"
          "$RUNNER_TEMP/broker/bin/python" -m pip install --quiet ./pwn-broker
      - name: Install each package and start its commands
        run: '"$RUNNER_TEMP/broker/bin/python" .github/scripts/install-check.py dist'

  kali:
    # Each recipe's current build, as the packages job left it, installed inside the official
    # Kali image from the folder index with the container's network switched off, and each
    # command started with --help. Kali's own Python is not the runtime's (Kali moved to 3.14),
    # and install-check.py checks that each Python tool's environment was made by its runtime.
    # The image is not pinned on purpose: the job is there to notice when Kali changes under the
    # tools. As in pwn-broker's kali job, it is not a container job; --init gives the container
    # a PID 1 that reaps orphaned processes, the checkouts are mounted read-only, and the
    # evidence folder is uploaded whatever the result. publish waits for it, because a
    # published build is never replaced.
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sha256
          path: ${{ runner.temp }}/dist-sha256
      - name: Check the packages are the ones built
        # the SHA-256 the packages job recorded before pwn-broker's install and the install check,
        # as its output and as its artifact: both must be there and both must agree
        env:
          OUTPUT: ${{ needs.packages.outputs.dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          WANT="$(cat "$RUNNER_TEMP/dist-sha256/dist.sha256")"
          got="$(cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$WANT" != "$OUTPUT" ] || [ "$got" != "$WANT" ]; then
            echo "fail  dist/ is not what the packages job built (output ${OUTPUT:-nothing}, artifact ${WANT:-nothing}, got $got)" >&2
            exit 1
          fi
          echo "ok    dist/ is what the packages job built"
      - name: Check out pwn-broker
        # the same branch as in the packages job
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Real-Fruit-Snacks/pwn-broker
          ref: ${{ vars.PWN_BROKER_REF || 'main' }}
          path: pwn-broker
          persist-credentials: false
      - name: Start Kali
        run: |
          mkdir -p "$RUNNER_TEMP/kali-evidence"
          {
            echo "pwn-shop $(git rev-parse HEAD)"
            echo "pwn-broker $(git -C pwn-broker rev-parse HEAD)"
          } > "$RUNNER_TEMP/kali-evidence/checkouts.txt"
          docker run -d --init --name kali --hostname kali \
            -v "$PWD:/shop:ro" -v "$PWD/dist:/packages:ro" -v "$PWD/pwn-broker:/pwn-broker:ro" \
            -v "$RUNNER_TEMP/kali-evidence:/evidence" \
            kalilinux/kali-rolling sleep infinity
      - name: Prepare Kali, with the network on
        run: docker exec kali sh /shop/.github/scripts/kali-packages.sh prepare
      - name: Switch the network off
        # the container's only network is the default bridge; without it there is only loopback
        run: |
          docker network disconnect bridge kali
          networks="$(docker inspect --format '{{json .NetworkSettings.Networks}}' kali)"
          echo "$networks" | tee "$RUNNER_TEMP/kali-evidence/networks.txt"
          if [ "$networks" != "{}" ]; then
            echo "fail  the container is still on a network"
            exit 1
          fi
          echo "ok    the container is on no network"
      - name: Install each package with the network off
        # install-check.py --network-off first shows that nothing resolves or answers
        run: docker exec kali sh /shop/.github/scripts/kali-packages.sh install
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kali-packages-evidence
          path: ${{ runner.temp }}/kali-evidence
      - name: Remove the container
        if: always()
        run: docker rm -f kali || true

  publish:
    # Main only, after every other job: lint, the tests, the README panel, the install check
    # and the install in Kali. It uploads what the packages job installed, not a second build.
    # A run waits for the one before it and never cancels it.
    needs: [lint, test, art, packages, kali]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install --require-hashes -r ci-requirements.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-sha256
          path: ${{ runner.temp }}/dist-sha256
      - name: Check the packages are the ones built
        # the SHA-256 the packages job recorded before pwn-broker's install and the install check,
        # as its output and as its artifact: both must be there and both must agree
        env:
          OUTPUT: ${{ needs.packages.outputs.dist }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          WANT="$(cat "$RUNNER_TEMP/dist-sha256/dist.sha256")"
          got="$(cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          if [ -z "$WANT" ] || [ "$WANT" != "$OUTPUT" ] || [ "$got" != "$WANT" ]; then
            echo "fail  dist/ is not what the packages job built (output ${OUTPUT:-nothing}, artifact ${WANT:-nothing}, got $got)" >&2
            exit 1
          fi
          echo "ok    dist/ is what the packages job built"
      - name: Check each zip against its card
        run: |
          for zip in dist/*.zip; do
            want="$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' "${zip%.zip}.toml")"
            echo "$want  $zip" | sha256sum -c -
          done
      - name: Publish each build that has no release
        # gh release create makes a draft, uploads the files and then publishes it. A run that
        # stops between the two leaves the draft, which is not a release: it is not counted as
        # published here, and one with the tag about to be made is deleted first, by its id,
        # so the build is published whole by this run. The releases are read a page at a time.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -eu
          python build.py plan > plan.txt
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.id, .draft, .tag_name] | @tsv' > all-releases.txt
          awk -F '\t' '$2 == "false" { print $3 }' all-releases.txt > releases.txt
          while read -r tool tag file; do
            if grep -Fxq -- "$tag" releases.txt; then
              echo "ok    $tag is already published"
              continue
            fi
            awk -F '\t' -v tag="$tag" '$2 == "true" && $3 == tag { print $1 }' all-releases.txt > drafts.txt
            while read -r id; do
              gh api --method DELETE "repos/$GH_REPO/releases/$id" </dev/null
              echo "warn  deleted a draft of $tag that an unfinished run left"
            done < drafts.txt
            card="${file%.zip}.toml"
            python build.py notes "dist/$card" > "notes-$tool.txt"
            gh release create "$tag" "dist/$file" "dist/sums/$tag/SHA256SUMS.txt" "dist/$card" \
              --title "$tag" --notes-file "notes-$tool.txt" --target "$COMMIT" --latest=false </dev/null
            echo "ok    published $tag"
          done < plan.txt
      - name: Replace the index
        # The index is rebuilt from the card of every release, so a withdrawn build (a deleted
        # release) drops out of it. The index release is made once and never marked latest.
        # index.toml is uploaded only when it differs from the one there, so it is not briefly
        # missing on every push. A draft is not a release and is left out: its card would put a
        # build in the index whose zip cannot be downloaded. Every tag in plan.txt has a release
        # by now, made by the step above or found by it, so those are added to the list in case
        # it does not show one made a moment ago.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/{tag}/{file}
        run: |
          set -eu
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft | not) | .tag_name' > listed.txt
          cut -d' ' -f2 plan.txt | sort -u - listed.txt > releases.txt
          mkdir cards current
          while read -r tag; do
            if [ "$tag" != index ]; then
              gh release download "$tag" --dir cards --pattern '*.toml' </dev/null
            fi
          done < releases.txt
          python build.py index cards --base-url "$BASE_URL" --out index.toml
          same=no
          if grep -Fxq index releases.txt; then
            if gh release download index --dir current --pattern index.toml </dev/null; then
              if cmp -s current/index.toml index.toml; then
                same=yes
              fi
            else
              echo "warn  the index release has no index.toml"
            fi
          else
            gh release create index --title index --target "$COMMIT" --latest=false \
              --notes "The index of the published packages. CI replaces index.toml here after each publish." </dev/null
          fi
          if [ "$same" = yes ]; then
            echo "ok    index.toml is unchanged"
          else
            gh release upload index index.toml --clobber </dev/null
            echo "ok    index.toml replaced"
          fi
